apiVersion: batch/v1
kind: Job
metadata:
  name: model-train
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: OnFailure
      volumes:
        - name: model-storage
          persistentVolumeClaim:
            claimName: model-pvc
      containers:
        - name: model-train
          image: docker.io/library/model-train:default
          imagePullPolicy: IfNotPresent
          env:
            - name: MODEL_PATH
              valueFrom:
                configMapKeyRef:
                  name: model-config
                  key: MODEL_PATH
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          volumeMounts:
            - name: model-storage
              mountPath: /data
